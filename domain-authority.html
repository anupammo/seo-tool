<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Domain Authority Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background-color: #f0f4f8;
    }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      background-color: #ff6f00;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #e65c00;
    }
  </style>
</head>
<body>

  <form id="mozDAForm">
    <h2>Check Domain Authority</h2>
    <input type="text" id="urlInput" placeholder="Enter domain (e.g. example.com)" required />
    <button type="submit">Check DA</button>
  </form>

  <script>
    document.getElementById('mozDAForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const domain = document.getElementById('urlInput').value.trim();
      if (domain) {
        const encodedDomain = encodeURIComponent(domain);
        window.location.href = `https://moz.com/domain-analysis?site=${encodedDomain}`;
      }
    });
  </script>

</body>
</html>
