<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Facebook Sharing Debugger</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background-color: #f7f7f7;
    }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      background-color: #4267B2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #365899;
    }
  </style>
</head>
<body>

  <form id="fbDebuggerForm">
    <h2>Facebook Sharing Debugger</h2>
    <input type="text" id="urlInput" placeholder="Enter website URL" required />
    <button type="submit">Debug</button>
  </form>

  <script>
    document.getElementById('fbDebuggerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const url = document.getElementById('urlInput').value.trim();
      if (url) {
        const encodedUrl = encodeURIComponent(url);
        window.location.href = `https://developers.facebook.com/tools/debug/?q=${encodedUrl}`;
      }
    });
  </script>

</body>
</html>
